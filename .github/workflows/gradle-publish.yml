name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -nE "s/^version = '([^']+)'$/\\1/p" build.gradle)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous=''
          if git cat-file -e HEAD^:build.gradle 2>/dev/null; then
            previous=$(git show HEAD^:build.gradle | sed -nE "s/^version = '([^']+)'$/\\1/p")
          fi
          if [[ -n "$previous" && "$previous" != "$version" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test
        run: ./gradlew clean test shadowJar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: BaritoneRemover-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: build/libs/*-all.jar
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/master' && needs.build.outputs.version_changed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BaritoneRemover-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Publish version release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          options=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v${VERSION}" && "$tag" != "v${VERSION}-"* ]]; then
              echo "Tag $tag does not match project version $VERSION" >&2
              exit 1
            fi
            if [[ "$tag" != "v${VERSION}" ]]; then
              options+=(--prerelease)
            fi
          fi
          gh release create "$tag" dist/*-all.jar --target "$GITHUB_SHA" --generate-notes "${options[@]}"
